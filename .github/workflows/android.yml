name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create releases and push version.json

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    # ── Generate build version from timestamp ────────────────────────────────
    - name: Generate build version
      id: version
      run: |
        VERSION="1.0.$(date +%Y%m%d%H%M)"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    # ── Build web bundle ─────────────────────────────────────────────────────
    - name: Build Web App
      run: npm run build

    # ── Commit web bundle for OTA delivery ──────────────────────────────────
    - name: Commit dist.zip to repo
      run: |
        cd dist
        zip -r ../dist.zip .
        cd ..
        echo "Bundle size: $(du -sh dist.zip | cut -f1)"
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        git add dist.zip
        git diff --staged --quiet || git commit -m "chore: push new OTA dist.zip [skip ci]"

    # ── Update version.json so devices know to download this zip ─────────
    - name: Update version.json
      run: |
        DOWNLOAD_URL="https://cdn.jsdelivr.net/gh/Techmastergojo/Engro-Connect@main/dist.zip"
        echo "{\"version\":\"${{ steps.version.outputs.VERSION }}\",\"url\":\"$DOWNLOAD_URL\"}" > version.json
        git add version.json
        git diff --staged --quiet || git commit -m "chore: update OTA version to ${{ steps.version.outputs.TAG }} [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ── Build Android APK ────────────────────────────────────────────────────
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Engro-Connect-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
