name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate build version
        id: version
        run: |
          VERSION="1.0.$(date +%Y%m%d%H%M)"
          TAG="v$VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          echo "Building version: $VERSION"
          echo "Release tag: $TAG"

      - name: Regenerate transparent logo and site data
        run: python update_script.py || echo "update_script.py failed (non-fatal)"

      - name: Build Web App
        run: npm run build

      - name: Zip web bundle for OTA
        run: |
          mkdir -p www
          cp -r dist/. www/
          zip -r dist.zip www/
          echo "Bundle size:"
          ls -lh dist.zip
          echo "Zip contents preview:"
          unzip -l dist.zip | head -20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Verify build output
        run: |
          echo "Checking APK..."
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

          echo "Checking OTA bundle..."
          ls -lh dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Engro Connect ${{ steps.version.outputs.TAG }}"
          body: |
            Auto-generated Engro Enfrashare release.

            Version: ${{ steps.version.outputs.VERSION }}

            Includes:
            - Android APK (debug)
            - OTA web bundle (dist.zip)
          files: |
            dist.zip
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages (OTA)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"
          DOWNLOAD_URL="https://techmastergojo.github.io/Engro-Connect/dist.zip"
          
          mkdir -p gh-pages-deploy
          cp dist.zip gh-pages-deploy/
          printf '{"version":"%s","url":"%s"}\n' "$VERSION" "$DOWNLOAD_URL" > gh-pages-deploy/version.json
          
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-deploy
          publish_branch: gh-pages
          force_orphan: true