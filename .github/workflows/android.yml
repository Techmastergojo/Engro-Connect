name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate build version
        id: version
        run: |
          VERSION="1.0.$(date +%Y%m%d%H%M)"
          TAG="v$VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          echo "Building version: $VERSION"
          echo "Release tag: $TAG"

      - name: Regenerate transparent logo and site data
        run: python update_script.py || echo "update_script.py failed (non-fatal)"

      - name: Build Web App
        run: npm run build

      - name: Zip web bundle for OTA
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..
          echo "Bundle size:"
          ls -lh dist.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Verify build output
        run: |
          echo "Checking APK..."
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

          echo "Checking OTA bundle..."
          ls -lh dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Engro Connect ${{ steps.version.outputs.TAG }}"
          body: |
            Auto-generated Engro Enfrashare release.

            Version: ${{ steps.version.outputs.VERSION }}

            Includes:
            - Android APK (debug)
            - OTA web bundle (dist.zip)
          files: |
            dist.zip
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"
          DOWNLOAD_URL="https://github.com/Techmastergojo/Engro-Connect/releases/download/${TAG}/dist.zip"

          echo "Version: $VERSION"
          echo "Download URL: $DOWNLOAD_URL"

          printf '{"version":"%s","url":"%s"}\n' "$VERSION" "$DOWNLOAD_URL" > version.json

          echo "Generated version.json:"
          cat version.json

          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          git add version.json

          if git diff --staged --quiet; then
            echo "No changes to version.json"
          else
            git commit -m "chore: update OTA version to $TAG [skip ci]"
            git push
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}