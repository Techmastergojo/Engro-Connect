name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create releases and push version.json

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    # ── Generate build version from timestamp ────────────────────────────────
    - name: Generate build version
      id: version
      run: |
        VERSION="1.0.$(date +%Y%m%d%H%M)"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    # ── Build web bundle ─────────────────────────────────────────────────────
    - name: Build Web App
      run: npm run build

    # ── Zip web bundle for OTA delivery ─────────────────────────────────────
    - name: Zip web bundle for OTA
      run: |
        cd dist
        zip -r ../dist.zip .
        cd ..
        echo "Bundle size: $(du -sh dist.zip | cut -f1)"

    # ── Create GitHub Release with bundle ────────────────────────────────────
    - name: Create GitHub Release
      id: release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        name: "Engro Connect ${{ steps.version.outputs.TAG }}"
        body: "Auto-generated OTA update bundle"
        files: dist.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ── Update version.json so devices know to download this release ─────────
    - name: Update version.json
      run: |
        DOWNLOAD_URL="https://github.com/Techmastergojo/Engro-Connect/releases/download/${{ steps.version.outputs.TAG }}/dist.zip"
        echo "{\"version\":\"${{ steps.version.outputs.VERSION }}\",\"url\":\"$DOWNLOAD_URL\"}" > version.json
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        git add version.json
        git diff --staged --quiet || git commit -m "chore: update OTA version to ${{ steps.version.outputs.TAG }} [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ── Build Android APK ────────────────────────────────────────────────────
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Engro-Connect-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
