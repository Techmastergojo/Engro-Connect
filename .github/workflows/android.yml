name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate build version
        id: version
        run: |
          VERSION="1.0.$(date +%Y%m%d%H%M)"
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Regenerate transparent logo and site data
        run: |
          python update_script.py || echo "update_script.py failed (non-fatal)"
          python parse_analytics_data.py || echo "parse_analytics_data.py failed (non-fatal)"

      - name: Build Web App
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Verify APK
        run: |
          echo "Checking APK..."
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Engro Enfrashare ${{ steps.version.outputs.TAG }}"
          body: |
            **Version:** ${{ steps.version.outputs.VERSION }}

            ### Install
            Download the APK below and tap to install on Android.
            It will automatically replace the existing app — no uninstall needed.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json on main branch
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"
          APK_URL="https://github.com/Techmastergojo/Engro-Connect/releases/download/${TAG}/app-debug.apk"

          printf '{"version":"%s","apkUrl":"%s"}\n' "$VERSION" "$APK_URL" > version.json

          echo "Generated version.json:"
          cat version.json

          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add version.json

          if git diff --staged --quiet; then
            echo "No changes to version.json"
          else
            git commit -m "chore: update version to $TAG [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}