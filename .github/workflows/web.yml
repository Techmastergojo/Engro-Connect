name: Deploy Web Build to Engro-Connect-Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate build version
        id: version
        run: |
          VERSION="1.0.$(date +%Y%m%d%H%M)"
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building web version: $VERSION"

      - name: Run data scripts (non-fatal)
        run: |
          python update_script.py || echo "update_script.py skipped"
          python parse_analytics_data.py || echo "parse_analytics_data.py skipped"

      - name: Build web app
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION }}
          VITE_BUG_TOKEN: ${{ secrets.BUG_REPORT_TOKEN }}
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      # ── Push dist/ to Engro-Connect-Web repo ──────────────────────────────
      - name: Deploy dist to Engro-Connect-Web
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Clone the web repo using the PAT
          git clone https://x-access-token:${{ secrets.WEB_DEPLOY_TOKEN }}@github.com/Techmastergojo/Engro-Connect-Web.git web-repo

          # Wipe everything except .git
          find web-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy fresh build
          cp -r dist/. web-repo/

          # Add a simple .nojekyll so GitHub Pages serves assets with underscores
          touch web-repo/.nojekyll

          # Write version.json for the web repo too
          printf '{"version":"%s","apkUrl":"https://github.com/Techmastergojo/Engro-Connect-Web/releases/download/v%s/app-debug.apk"}\n' "$VERSION" "$VERSION" > web-repo/version.json

          cd web-repo
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "chore: deploy web build $VERSION [skip ci]"
            git push
          fi

      # ── Also build APK and release it on Engro-Connect-Web ──────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Create Release on Engro-Connect-Web
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          # Create the release via GitHub REST API
          RELEASE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.WEB_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Techmastergojo/Engro-Connect-Web/releases \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"Engro Enfrashare Web $TAG\",
              \"body\": \"**Version:** $VERSION\n\n### Android APK\nDownload below and tap to install.\n\n### Whats New\n- Map search auto-zooms to matching sites\n- Autocomplete dropdown with instant results\n- DG Report tab fully enabled\",
              \"draft\": false,
              \"prerelease\": false
            }")

          echo "Release response: $RELEASE"
          UPLOAD_URL=$(echo "$RELEASE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('upload_url','').split('{')[0])")
          echo "Upload URL: $UPLOAD_URL"

          if [ -n "$UPLOAD_URL" ] && [ "$UPLOAD_URL" != "None" ]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.WEB_DEPLOY_TOKEN }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              "${UPLOAD_URL}?name=app-debug.apk&label=Download+APK" \
              --data-binary @"$APK"
            echo "APK uploaded successfully"
          else
            echo "Failed to get upload URL from release response"
            exit 1
          fi
